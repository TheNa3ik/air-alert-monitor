<!DOCTYPE html>
<html lang="en">
<head>
    <title>Air Alert API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="scalar-app"></div>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

<script>
    const targetElement = document.getElementById('scalar-app');

    const config = {
        showDeveloperTools: "never",
        theme: 'kepler',
        hideModels: false,
        hideTestRequestButton: true,
        defaultOpenFirstTag: false,

        sources: [
            {
                title: 'Українська',
                url: './openapi-uk.json',
                default: true
            },
            {
                title: 'English',
                url: './openapi-en.json'
            }
        ]
    };

    Scalar.createApiReference(targetElement, config);
</script>
</body>
</html>
