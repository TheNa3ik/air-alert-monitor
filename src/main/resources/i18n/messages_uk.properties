# ==== General API Info ====
api.info.desc=Відстеження історії та статистики повітряних тривог в Україні на основі даних сервісу повітряних тривог Ubilling.\n\n**Затримка даних:** оновлення перевіряються кожні 5 секунд і потребують 2 підтверджень (загальна затримка становить близько 10 секунд).\n\n**Обмеження частоти запитів:** для публічного доступу дозволено до 60 запитів на хвилину з однієї IP-адреси.
api.security.webhookManagementToken.desc=Введіть токен керування, отриманий під час реєстрації webhook.
api.security.webhookSignature.desc=Підпис HMAC-SHA256 необробленого тіла запиту, створений за допомогою `secret` підписки.

# ==== Webhook Callback (OpenAPI Config) ====
api.webhook.callback.summary=Сповіщення про подію повітряної тривоги
api.webhook.callback.desc=Надсилається на URL-адресу вашої підписки щоразу, коли в регіоні, за яким ведеться спостереження, починається або завершується повітряна тривога.\n\nЗапит має цифровий підпис: перед обробкою payload перевірте заголовок `X-Signature`. Підпис HMAC-SHA256 обчислюється для необробленого тіла запиту з використанням `secret`, отриманого під час реєстрації.\n\nПротягом розумного часу очікування необхідно повернути будь-який статус із діапазону 2xx. Відповіді з іншими статусами враховуються як послідовні помилки доставки та можуть призвести до автоматичного вимкнення підписки.
api.webhook.callback.res.200=Сповіщення успішно отримано. Також приймаються будь-які інші відповіді зі статусом 2xx.
api.webhook.callback.res.5xx=Вважається помилкою доставки. Враховується в лічильнику послідовних помилок; після повторних помилок підписку буде автоматично вимкнено.
api.webhook.callback.res.default=Будь-яка відповідь зі статусом не 2xx (зокрема перевищення часу очікування) вважається помилкою доставки.

# ==== Regions Controller ====
api.region.tag.desc=Отримання поточного статусу, історії та статистики повітряних тривог. Для публічного доступу встановлено обмеження — до 60 запитів на хвилину.
api.region.current.all.summary=Отримати поточний статус повітряної тривоги для регіонів
api.region.current.all.desc=Повертає поточний статус повітряної тривоги для всіх регіонів із можливістю фільтрації за ідентифікатором, назвою або активним статусом. Якщо параметри `ids` і `names` не вказані, повертаються всі регіони.
api.region.current.single.summary=Отримати поточний статус повітряної тривоги для одного регіону
api.region.current.single.desc=Повертає поточний статус повітряної тривоги для регіону із вказаним ідентифікатором.
api.region.history.all.summary=Отримати історію повітряних тривог для всіх регіонів
api.region.history.all.desc=Повертає список подій повітряних тривог із пагінацією для всіх регіонів або для відфільтрованого набору. Використовуйте `period` для відносного періоду, наприклад `day`, `week`, `month`, `year` або `all`, або явно вкажіть діапазон за допомогою параметрів `from` і `to`. Максимальний розмір сторінки становить 100 для публічних користувачів і 1000 для довірених користувачів.
api.region.history.single.summary=Отримати історію повітряних тривог для одного регіону
api.region.history.single.desc=Повертає список подій повітряних тривог із пагінацією для одного регіону. Для параметрів `period`, `from` і `to` застосовуються ті самі правила фільтрації, що й для `/history`.
api.region.stats.all.summary=Отримати статистику повітряних тривог для всіх регіонів
api.region.stats.all.desc=Повертає агреговану статистику повітряних тривог для кожного регіону за вказаний проміжок часу, зокрема кількість подій, загальну та найдовшу тривалість повітряної тривоги. Результати відсортовано за спаданням загального часу тривоги.
api.region.stats.single.summary=Отримати статистику повітряних тривог для одного регіону
api.region.stats.single.desc=Повертає агреговану статистику повітряних тривог для одного регіону за вказаний проміжок часу, зокрема кількість подій, загальну та найдовшу тривалість повітряної тривоги.

# ==== Webhooks Controller ====
api.webhook.tag.desc=Реєстрація та керування webhook-підписками для отримання сповіщень про початок і завершення повітряних тривог
api.webhook.register.summary=Зареєструвати webhook-підписку
api.webhook.register.desc=Створює нову webhook-підписку для вказаних регіонів. Надана URL-адреса ОБОВ'ЯЗКОВО має використовувати HTTPS і вести на публічний, а не внутрішній хост. У відповіді містяться `secret` для перевірки HMAC-підпису отриманих payload і `managementToken`, який використовується як Bearer-токен для подальшого керування підпискою. Обидва значення відображаються лише один раз.
api.webhook.get.summary=Отримати інформацію про webhook-підписку
api.webhook.get.desc=Повертає загальну інформацію про підписку без `secret`. Потребує токен керування.
api.webhook.update.summary=Оновити регіони webhook-підписки
api.webhook.update.desc=Повністю замінює список регіонів для цієї підписки. Потребує токен керування.
api.webhook.reactivate.summary=Повторно активувати webhook-підписку
api.webhook.reactivate.desc=Повторно активує підписку, яку було автоматично вимкнено через повторні помилки доставки. Потребує токен керування.
api.webhook.delete.summary=Видалити webhook-підписку
api.webhook.delete.desc=Назавжди видаляє підписку. Потребує токен керування.

# ==== Parameters ====
api.param.ids=Фільтрувати за ідентифікаторами регіонів. Не можна використовувати разом із `names`.
api.param.names=Фільтрувати за назвами регіонів. Не можна використовувати разом із `ids`.
api.param.active=Якщо параметр вказано, повертаються лише регіони, у яких стан активності повітряної тривоги відповідає цьому значенню.
api.param.tz.since=Часовий пояс IANA, який використовується для форматування часового штампа `since`, наприклад `Europe/Kyiv`.
api.param.tz.event=Часовий пояс IANA, який використовується для форматування часових міток подій.
api.param.tz.stats=Часовий пояс IANA, який використовується для форматування часових міток `from` і `to` у відповіді.
api.param.lang=Мова назви регіону: `ua` або `en`.
api.param.regionId=Ідентифікатор регіону
api.param.period=Відносний часовий проміжок: `day`, `week`, `month`, `year` або `all`. Ігнорується, якщо вказано `from`.
api.param.from=Початок явно заданого діапазону дат у форматі ISO-8601 offset date-time.
api.param.to=Кінець явно заданого діапазону дат у форматі ISO-8601 offset date-time. За замовчуванням — поточний момент.
api.param.pageable=Параметри пагінації та сортування. За замовчуванням сортування виконується за `startedAt` у порядку спадання.
api.param.webhookId=Ідентифікатор webhook-підписки

# ==== Responses (Success) ====
api.res.regionStatusList=Список статусів регіонів
api.res.regionStatus=Статус регіону
api.res.pageAlertEvents=Сторінка подій повітряних тривог
api.res.pageAlertEventsRegion=Сторінка подій повітряних тривог для регіону
api.res.listRegionStats=Список статистичних даних за регіонами
api.res.regionStats=Статистика регіону
api.res.webhookCreated=Підписку створено
api.res.webhookSummary=Загальна інформація про підписку
api.res.webhookUpdated=Оновлена інформація про підписку
api.res.webhookReactivated=Повторно активована інформація про підписку
api.res.webhookDeleted=Підписку видалено

# ==== Responses (Errors) ====
api.err.400.filterOrTz=Одночасно вказано `ids` і `names`, або параметр `tz` не є коректним часовим поясом IANA.
api.err.400.tz=`tz` не є коректним часовим поясом IANA.
api.err.404.regionNotFound=Регіон не знайдено
api.err.400.historyFilters=Одночасно вказано `ids` і `names`, `tz` має некоректне значення, `period` не розпізнано або значення `from` пізніше за `to`.
api.err.400.historyFiltersSingle=`tz` має некоректне значення, `period` не розпізнано або значення `from` пізніше за `to`.
api.err.400.webhookUrl=URL-адреса webhook має некоректний формат, не використовує HTTPS, не містить доступного для визначення хоста або веде на приватну чи внутрішню адресу.
api.err.404.noRegions=Жоден із вказаних ідентифікаторів регіонів не існує
api.err.409.duplicateUrl=Для цієї URL-адреси вже існує активна підписка
api.err.401.auth=Заголовок авторизації відсутній або має некоректний формат, або токен керування недійсний
api.err.404.webhookNotFound=Підписку не знайдено
api.err.404.webhookOrRegionsNotFound=Підписку не знайдено або жоден із вказаних ідентифікаторів регіонів не існує

