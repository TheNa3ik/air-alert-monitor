# ==== General API Info ====
api.info.desc=Tracks Ukrainian air raid alert history and stats, built on top of the Ubilling aerial alerts feed.\n\n**Data Latency:** Updates are polled every 5 seconds and require 2 confirmations (~10s total latency).\n\n**Rate Limiting:** Public access is limited to 60 requests per minute per IP.
api.security.webhookManagementToken.desc=Enter the management token received during webhook registration.
api.security.webhookSignature.desc=HMAC-SHA256 signature of the raw request body, signed with the subscription's `secret`.

# ==== Webhook Callback (OpenAPI Config) ====
api.webhook.callback.summary=Alert event notification
api.webhook.callback.desc=Sent to your subscribed URL whenever a tracked region's alert starts or ends.\n\nThe request is signed: verify the `X-Signature` header (HMAC-SHA256 of the raw body, using the `secret` returned at registration) before trusting the payload.\n\nRespond with any 2xx status within a reasonable timeout. Non-2xx responses count toward the subscription's consecutive failure count and may auto-disable it.api.webhook.callback.res.200=Notification acknowledged. Also accepts any other 2xx status.
api.webhook.callback.res.200=Notification acknowledged. Also accepts any other 2xx status.
api.webhook.callback.res.5xx=Treated as a delivery failure. Counts toward the subscription's consecutive failure count; the subscription is auto-disabled after repeated failures.
api.webhook.callback.res.default=Any non-2xx response (including timeouts) is treated as a delivery failure.

# ==== Regions Controller ====
api.region.tag.desc=Query current alert status, history and statistics. Public access is limited to 60 requests/minute.
api.region.current.all.summary=Get current alert status for regions
api.region.current.all.desc=Returns the current alert status for all regions, optionally filtered by id, name, or active state. If neither `ids` nor `names` are provided, all regions are returned.
api.region.current.single.summary=Get current alert status for a single region
api.region.current.single.desc=Returns the current alert status for the region with the given id.
api.region.history.all.summary=Get alert history across regions
api.region.history.all.desc=Returns a paginated list of alert events across all regions, or a filtered subset. Use either `period` (relative window, e.g. `day`, `week`, `month`, `year`, `all`) or an explicit `from`/`to` range. Page size is capped at 100 for public callers (60 RPM) and 1000 for trusted callers.
api.region.history.single.summary=Get alert history for a single region
api.region.history.single.desc=Returns a paginated list of alert events for one region. Same filtering rules as `/history` apply for `period`/`from`/`to`.
api.region.stats.all.summary=Get alert statistics across regions
api.region.stats.all.desc=Returns aggregated alert statistics (event count, total and longest alert duration) for each region over the requested time window, sorted by total alert time descending.
api.region.stats.single.summary=Get alert statistics for a single region
api.region.stats.single.desc=Returns aggregated alert statistics (event count, total and longest alert duration) for one region over the requested time window.

# ==== Webhooks Controller ====
api.webhook.tag.desc=Register and manage webhook subscriptions that receive alert start/end notifications
api.webhook.register.summary=Register a webhook subscription
api.webhook.register.desc=Creates a new webhook subscription for the given regions. The provided URL MUST be HTTPS and must resolve to a public, non-internal host. The response includes a `secret` (used to verify the HMAC signature on delivered payloads) and a `managementToken` (used as a bearer token to manage this subscription later). Both values are shown only once.
api.webhook.get.summary=Get a webhook subscription
api.webhook.get.desc=Returns a summary of the subscription (without the secret). Requires the management token.
api.webhook.update.summary=Update the regions a webhook is subscribed to
api.webhook.update.desc=Replaces the full set of regions for this subscription. Requires the management token.
api.webhook.reactivate.summary=Reactivate a webhook subscription
api.webhook.reactivate.desc=Re-enables a subscription that was auto-disabled after repeated delivery failures. Requires the management token.
api.webhook.delete.summary=Delete a webhook subscription
api.webhook.delete.desc=Permanently removes the subscription. Requires the management token.

# ==== Parameters ====
api.param.ids=Filter by region id. Cannot be combined with `names`.
api.param.names=Filter by region name. Cannot be combined with `ids`.
api.param.active=If set, only return regions whose alert-active state matches this value
api.param.tz.since=IANA timezone used to format the `since` timestamp, e.g. `Europe/Kyiv`
api.param.tz.event=IANA timezone used to format event timestamps
api.param.tz.stats=IANA timezone used to format the `from`/`to` timestamps in the response
api.param.lang=Language for the region name: `ua` or `en`
api.param.regionId=Region id
api.param.period=Relative time window: `day`, `week`, `month`, `year`, or `all`. Ignored if `from` is set.
api.param.from=Start of an explicit date range (ISO-8601 offset date-time)
api.param.to=End of an explicit date range (ISO-8601 offset date-time). Defaults to now.
api.param.pageable=Pagination and sorting. Default sort is `startedAt` descending.
api.param.webhookId=Webhook subscription id

# ==== Responses (Success) ====
api.res.regionStatusList=List of region statuses
api.res.regionStatus=Region status
api.res.pageAlertEvents=Page of alert events
api.res.pageAlertEventsRegion=Page of alert events for the region
api.res.listRegionStats=List of per-region statistics
api.res.regionStats=Region statistics
api.res.webhookCreated=Subscription created
api.res.webhookSummary=Subscription summary
api.res.webhookUpdated=Updated subscription summary
api.res.webhookReactivated=Reactivated subscription summary
api.res.webhookDeleted=Subscription deleted

# ==== Responses (Errors) ====
api.err.400.filterOrTz=Both `ids` and `names` provided, or `tz` is not a valid IANA timezone
api.err.400.tz=`tz` is not a valid IANA timezone
api.err.404.regionNotFound=Region not found
api.err.400.historyFilters=Both `ids` and `names` provided, `tz` is invalid, `period` is unrecognized, or `from` is after `to`
api.err.400.historyFiltersSingle=`tz` is invalid, `period` is unrecognized, or `from` is after `to`
api.err.400.webhookUrl=The webhook URL is malformed, not HTTPS, has no resolvable host, or resolves to a private/internal address
api.err.404.noRegions=None of the provided region ids exist
api.err.409.duplicateUrl=An active subscription for this URL already exists
api.err.401.auth=Authorization header is missing/malformed, or the management token is invalid
api.err.404.webhookNotFound=Subscription not found
api.err.404.webhookOrRegionsNotFound=Subscription not found, or none of the provided region ids exist

