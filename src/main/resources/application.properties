# ==== Application ====
spring.application.name=air-alert-monitor
spring.config.import=optional:file:.env[.properties]

# ==== Database ====
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# ==== API docs (off in prod) ====
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==== Actuator ====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==== Alert polling ====
air-alert.polling.enabled=${POLLING_ENABLED:true}
air-alert.polling.interval-ms=${POLLING_INTERVAL_MS:5000}
air-alert.polling.confirmation-polls=${POLLING_CONFIRMATION_POLLS:2}

# ==== Ubilling source (polling data provider + fallback chain) ====
air-alert.ubilling.source=${UBILLING_SOURCE:skog}
air-alert.ubilling.fallback-sources=${UBILLING_FALLBACK_SOURCES:klimenko,jaam,aui,ual}
air-alert.ubilling.failure-threshold=${UBILLING_FAILURE_THRESHOLD:3}
air-alert.ubilling.recovery-check-polls=${UBILLING_RECOVERY_CHECK_POLLS:12}

# ==== Internal trusted-caller access (bypasses per-IP rate limit) ====
air-alert.internal-api-key=${INTERNAL_API_KEY:}

# ==== Rate limiting ====
air-alert.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
air-alert.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
air-alert.rate-limit.trusted-requests-per-minute=${RATE_LIMIT_TRUSTED_RPM:200}

# ==== Webhooks ====
air-alert.webhook.require-https=${WEBHOOK_REQUIRE_HTTPS:true}