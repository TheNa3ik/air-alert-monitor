# ==== Application ====
spring.application.name=air-alert-monitor
spring.config.import=optional:file:.env[.properties]

# ==== Database ====
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# ==== API docs ====
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==== Actuator ====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==== Alert polling ====
air-alert.polling.enabled=true
air-alert.polling.interval-ms=5000
air-alert.polling.confirmation-polls=2

# ==== Ubilling source (polling data provider + fallback chain) ====
air-alert.ubilling.source=skog
air-alert.ubilling.fallback-sources=klimenko,jaam,aui,ual
air-alert.ubilling.failure-threshold=3
air-alert.ubilling.recovery-check-polls=12

# ==== Internal trusted-caller access (bypasses per-IP rate limit) ====
air-alert.internal-api-key=${INTERNAL_API_KEY}

# ==== Rate limiting ====
air-alert.rate-limit.enabled=true
air-alert.rate-limit.requests-per-minute=60
air-alert.rate-limit.trusted-requests-per-minute=200

# ==== Webhooks ====
air-alert.webhook.require-https=true