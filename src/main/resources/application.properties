spring.application.name=air-alert-monitor

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

air-alert.polling.enabled=${POLLING_ENABLED:true}
air-alert.internal-api-key=${INTERNAL_API_KEY:}

air-alert.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
air-alert.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
air-alert.rate-limit.trusted-requests-per-minute=${RATE_LIMIT_TRUSTED_RPM:200}

air-alert.webhook.require-https=${WEBHOOK_REQUIRE_HTTPS:true}