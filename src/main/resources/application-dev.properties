# ==== Application ====
spring.application.name=air-alert-monitor
spring.config.import=optional:file:.env[.properties]

# ==== Database ====
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable&gssEncMode=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# ==== API docs (on for local exploration) ====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==== Actuator (verbose for local debugging) ====
management.endpoints.web.exposure.include=health,info,env,beans
management.endpoint.health.show-details=always

# ==== Alert polling ====
air-alert.polling.enabled=${POLLING_ENABLED:true}

# ==== Rate limiting (disabled for local dev) ====
air-alert.rate-limit.enabled=false