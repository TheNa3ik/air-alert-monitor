# ==== API docs ====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==== Database ====
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable&gssEncMode=disable

# ==== Actuator ====
management.endpoints.web.exposure.include=health,info,env,beans
management.endpoint.health.show-details=always

# ==== Alert polling ====
air-alert.polling.enabled=false

# ==== Rate limiting ====
air-alert.rate-limit.enabled=false

# ==== Webhooks ====
air-alert.webhook.require-https=false